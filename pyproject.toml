[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "level-factory"
dynamic = ["version"]
description = "Production/orchestration layer over the Siliconight level-building toolchain."
requires-python = ">=3.11"
authors = [{ name = "Siliconight" }]
readme = "README.md"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = ["PySide6>=6.6"]  # Phase 3

[project.scripts]
level-factory = "apps.cli.main:main"

[project.gui-scripts]
level-factory-desktop = "apps.desktop.main:main"

[tool.setuptools.packages.find]
include = ["packages*", "adapters*", "apps*"]

# ONE VERSION, AND IT LIVES IN ./VERSION. This file said 0.22.0 while
# VERSION said 0.33.0 -- eleven releases -- because two files carried the
# same fact and only stayed equal while somebody remembered. 0.34.0
# corrected the number and added a check; 0.35.0 drifted again by one
# release anyway, in the very next patch. So the copy is gone rather
# than corrected: setuptools reads the same file the running code does.
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
